name: Catalog refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node.js 24
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - run: python -m pip install -r requirements.txt
      - name: Configure optional remote destinations
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-sheets-api.json"
            chmod 600 "$RUNNER_TEMP/google-sheets-api.json"
          fi
      - name: Refresh catalog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/google-sheets-api.json
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$SPREADSHEET_ID" ] && [ -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            python main.py --submission --output-dir refresh-output
          else
            echo "Remote credentials not fully configured; running the explicit CSV profile."
            python main.py --targets csv --output-dir refresh-output
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node.js 24
        if: always()
        with:
          name: catalog-${{ github.run_id }}
          path: refresh-output/
          retention-days: 30
