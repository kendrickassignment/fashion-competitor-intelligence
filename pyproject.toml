[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: requires an isolated real PostgreSQL database"]

[tool.coverage.run]
branch = true
source = ["src", "config", "main"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
