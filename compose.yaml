services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fashion
      POSTGRES_USER: fashion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fashion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion -d fashion"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fashion_pgdata:
